# Render Blueprint: database + API + website in one go (all on free plans).
# Render → New → Blueprint → pick this repository.
databases:
  - name: suuplan-db
    plan: free            # free Render Postgres expires after 30 days; switch DATABASE_URL to Neon for longer
    databaseName: suuplan

services:
  - type: web
    name: suuplan-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn suuplan.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: suuplan-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://suuplan.onrender.com
      - key: NOMINATIM_USER_AGENT
        value: SuuPlan/0.1 (NASA Space Apps 2026)
      - key: ANTHROPIC_API_KEY   # optional: without it the helper runs in FAQ mode
        sync: false

  - type: web
    name: suuplan
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
    routes:
      # The site calls /api/...; Render forwards it to the API, so no CORS setup is needed.
      # If Render gives the API a different address, change it here.
      - type: rewrite
        source: /api/*
        destination: https://suuplan-api.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
